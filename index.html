<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MINDMILL Trading Journal & Free Economic Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone to compile JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-[#08090C] text-slate-100 font-sans selection:bg-amber-400 selection:text-slate-950 min-h-screen overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const DEFAULT_ACCOUNTS = [
        { id: 'acc-1', name: 'Main Trading Account' }
      ];

      function App() {
        // Authentication State
        const [user, setUser] = useState(() => {
          const savedUser = localStorage.getItem('mindmill_trader_user');
          return savedUser ? JSON.parse(savedUser) : null;
        });
        const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
        const [authMode, setAuthMode] = useState('login');
        const [authEmail, setAuthEmail] = useState('');
        const [authPassword, setAuthPassword] = useState('');
        const [authError, setAuthError] = useState('');

        const [accounts, setAccounts] = useState(() => {
          const saved = localStorage.getItem('mindmill_accounts_v4');
          return saved ? JSON.parse(saved) : DEFAULT_ACCOUNTS;
        });

        const [activeAccountId, setActiveAccountId] = useState(accounts[0]?.id || 'acc-1');
        const [isNewAccountModalOpen, setIsNewAccountModalOpen] = useState(false);
        const [newAccountTitle, setNewAccountTitle] = useState('');

        const storageKey = user ? `mindmill_trades_${user.email}_profile_${activeAccountId}` : `mindmill_trades_profile_${activeAccountId}`;

        const [notes, setNotes] = useState(() => {
          const stored = localStorage.getItem(storageKey);
          if (stored) {
            try { return JSON.parse(stored); } catch(e) {}
          }
          return [];
        });

        useEffect(() => {
          localStorage.setItem(storageKey, JSON.stringify(notes));
        }, [notes, storageKey]);

        useEffect(() => {
          localStorage.setItem('mindmill_accounts_v4', JSON.stringify(accounts));
        }, [accounts]);

        const [selectedNoteId, setSelectedNoteId] = useState(null);
        const [activeTab, setActiveTab] = useState('dashboard');
        
        const [isTradeModalOpen, setIsTradeModalOpen] = useState(false);
        const [isCustomNewsModalOpen, setIsCustomNewsModalOpen] = useState(false);
        const [editingNoteId, setEditingNoteId] = useState(null);

        const [tradeForm, setTradeForm] = useState({
          symbol: 'NAS100',
          type: 'WIN',
          title: '',
          pnl: '',
          content: '',
          lessons: ''
        });

        // Load notes when active account or user changes
        useEffect(() => {
          const stored = localStorage.getItem(storageKey);
          if (stored) {
            try {
              const parsed = JSON.parse(stored);
              setNotes(parsed);
              setSelectedNoteId(parsed[0]?.id || null);
            } catch(e) {
              setNotes([]);
              setSelectedNoteId(null);
            }
          } else {
            setNotes([]);
            setSelectedNoteId(null);
          }
        }, [activeAccountId, user]);

        // Authentication Handlers
        const handleAuthSubmit = (e) => {
          e.preventDefault();
          setAuthError('');

          if (!authEmail || !authPassword) {
            setAuthError('Please fill in all fields');
            return;
          }

          if (authPassword.length < 6) {
            setAuthError('Password must be at least 6 characters');
            return;
          }

          const userData = { email: authEmail, id: btoa(authEmail) };
          localStorage.setItem('mindmill_trader_user', JSON.stringify(userData));
          setUser(userData);
          setIsAuthModalOpen(false);
          setAuthEmail('');
          setAuthPassword('');
        };

        const handleLogout = () => {
          localStorage.removeItem('mindmill_trader_user');
          setUser(null);
        };

        // Standardized Free Economic Calendar Data
        const [newsEvents, setNewsEvents] = useState([
          { id: 'free-1', title: 'Core CPI m/m (Inflation Rate)', country: 'USD', date: new Date().toISOString().slice(0, 10), time: '08:30', impact: 'High', forecast: '0.3%', previous: '0.2%' },
          { id: 'free-2', title: 'FOMC Federal Funds Rate Decision', country: 'USD', date: new Date().toISOString().slice(0, 10), time: '14:00', impact: 'High', forecast: '4.50%', previous: '4.75%' },
          { id: 'free-3', title: 'Non-Farm Payrolls (NFP)', country: 'USD', date: new Date().toISOString().slice(0, 10), time: '08:30', impact: 'High', forecast: '175K', previous: '142K' },
          { id: 'free-4', title: 'ECB Monetary Policy Decision', country: 'EUR', date: new Date().toISOString().slice(0, 10), time: '13:45', impact: 'High', forecast: '3.25%', previous: '3.50%' },
          { id: 'free-5', title: 'Bank of England Rate Decision', country: 'GBP', date: new Date().toISOString().slice(0, 10), time: '12:00', impact: 'High', forecast: '4.75%', previous: '5.00%' },
          { id: 'free-6', title: 'Retail Sales m/m', country: 'USD', date: new Date().toISOString().slice(0, 10), time: '08:30', impact: 'Medium', forecast: '0.4%', previous: '0.1%' },
          { id: 'free-7', title: 'Unemployment Rate', country: 'CAD', date: new Date().toISOString().slice(0, 10), time: '08:30', impact: 'High', forecast: '6.5%', previous: '6.6%' }
        ]);
        const [isNewsLoading, setIsNewsLoading] = useState(false);
        const [newsFilterCurrency, setNewsFilterCurrency] = useState('ALL');
        const [newsDateFilter, setNewsDateFilter] = useState('');
        const [customNewsData, setCustomNewsData] = useState({
          title: '',
          country: 'USD',
          date: new Date().toISOString().split('T')[0],
          time: '08:30',
          impact: 'High',
          forecast: '',
          previous: ''
        });

        // Simple Direct Open API Fetch
        const fetchFreeEconomicNews = async () => {
          setIsNewsLoading(true);
          try {
            const res = await fetch('https://financialmodelingprep.com/api/v3/economic_calendar?apikey=demo');
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && data.length > 0) {
                const formatted = data.slice(0, 25).map((evt, idx) => ({
                  id: `fmp-${idx}-${Date.now()}`,
                  title: evt.event || 'Economic Release',
                  country: (evt.country || 'USD').toUpperCase(),
                  date: evt.date ? evt.date.slice(0, 10) : new Date().toISOString().slice(0, 10),
                  time: evt.date && evt.date.length > 11 ? evt.date.slice(11, 16) : '08:30',
                  impact: evt.impact || 'High',
                  forecast: evt.estimate ? `${evt.estimate}` : '--',
                  previous: evt.previous ? `${evt.previous}` : '--'
                }));
                setNewsEvents(formatted);
              }
            }
          } catch (err) {
            console.log('Using integrated instant economic dataset.');
          } finally {
            setIsNewsLoading(false);
          }
        };

        useEffect(() => {
          fetchFreeEconomicNews();
        }, []);

        const selectedNote = useMemo(() => {
          return notes.find(n => n.id === selectedNoteId) || notes[0] || null;
        }, [notes, selectedNoteId]);

        const stats = useMemo(() => {
          const total = notes.length;
          if (total === 0) return { winRate: '0.0', totalPnl: 0, totalTrades: 0 };
          const wins = notes.filter(n => n.type === 'WIN');
          const winRate = ((wins.length / total) * 100).toFixed(1);
          const totalPnl = notes.reduce((acc, n) => acc + (Number(n.pnl) || 0), 0);
          return { winRate, totalPnl, totalTrades: total };
        }, [notes]);

        const handleCreateAccount = (e) => {
          e.preventDefault();
          if (!newAccountTitle.trim()) return;
          const newAcc = {
            id: `acc-${Date.now()}`,
            name: newAccountTitle.trim()
          };
          setAccounts([...accounts, newAcc]);
          setActiveAccountId(newAcc.id);
          setNewAccountTitle('');
          setIsNewAccountModalOpen(false);
        };

        const handleSaveTrade = (e) => {
          e.preventDefault();
          if (editingNoteId) {
            setNotes(notes.map(n => n.id === editingNoteId ? {
              ...n,
              symbol: tradeForm.symbol.toUpperCase(),
              type: tradeForm.type,
              title: tradeForm.title,
              pnl: parseFloat(tradeForm.pnl) || 0,
              content: tradeForm.content,
              lessons: tradeForm.lessons
            } : n));
          } else {
            const newNote = {
              id: Date.now().toString(),
              date: new Date().toISOString().split('T')[0],
              title: tradeForm.title || 'Custom Trade Strategy',
              symbol: tradeForm.symbol.toUpperCase(),
              type: tradeForm.type,
              content: tradeForm.content,
              lessons: tradeForm.lessons,
              pnl: parseFloat(tradeForm.pnl) || 0
            };
            setNotes([newNote, ...notes]);
            setSelectedNoteId(newNote.id);
          }
          setIsTradeModalOpen(false);
          setEditingNoteId(null);
          setTradeForm({ symbol: 'NAS100', type: 'WIN', title: '', pnl: '', content: '', lessons: '' });
        };

        const handleDeleteNote = (id) => {
          if (confirm('Delete this trade entry?')) {
            const remaining = notes.filter(n => n.id !== id);
            setNotes(remaining);
            if (selectedNoteId === id) {
              setSelectedNoteId(remaining[0]?.id || null);
            }
          }
        };

        const handleAddCustomNews = (e) => {
          e.preventDefault();
          const newEvt = {
            id: `custom-${Date.now()}`,
            title: customNewsData.title,
            country: customNewsData.country.toUpperCase(),
            date: customNewsData.date,
            time: customNewsData.time || 'All Day',
            impact: customNewsData.impact,
            forecast: customNewsData.forecast || '--',
            previous: customNewsData.previous || '--'
          };
          setNewsEvents([newEvt, ...newsEvents]);
          setIsCustomNewsModalOpen(false);
          setCustomNewsData({
            title: '',
            country: 'USD',
            date: new Date().toISOString().split('T')[0],
            time: '08:30',
            impact: 'High',
            forecast: '',
            previous: ''
          });
        };

        const filteredNews = useMemo(() => {
          return newsEvents.filter(event => {
            const matchesCurrency = newsFilterCurrency === 'ALL' || event.country === newsFilterCurrency;
            const matchesDate = !newsDateFilter || event.date === newsDateFilter;
            return matchesCurrency && matchesDate;
          });
        }, [newsEvents, newsFilterCurrency, newsDateFilter]);

        return (
          <div className="min-h-screen flex flex-col relative overflow-x-hidden w-full bg-[#08090C] text-slate-100 font-sans">
            
            {/* Header */}
            <header className="border-b border-amber-500/15 bg-[#0C0E14]/90 backdrop-blur-md px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between sticky top-0 z-30 gap-3">
              <div className="flex items-center space-x-2.5">
                <div className="h-9 w-9 rounded-xl bg-gradient-to-br from-amber-300 via-amber-500 to-amber-700 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-amber-500/20 border border-amber-300/30">
                  MM
                </div>
                <div>
                  <h1 className="text-lg font-black tracking-widest text-amber-200 uppercase font-mono">MINDMILL</h1>
                </div>
              </div>

              {/* Navigation Bar */}
              <div className="flex items-center bg-[#050608] p-1 rounded-xl border border-amber-500/20 space-x-1">
                <button 
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'dashboard' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-amber-200'}`}
                >
                  Dashboard & Journal
                </button>
                <button 
                  onClick={() => setActiveTab('news')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'news' ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-amber-200'}`}
                >
                  Economic Calendar
                </button>
              </div>

              {/* Account Switcher */}
              <div className="flex items-center bg-[#050608] p-1 rounded-xl border border-amber-500/20 max-w-full overflow-x-auto space-x-1">
                {accounts.map(acc => (
                  <button
                    key={acc.id}
                    onClick={() => setActiveAccountId(acc.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap ${activeAccountId === acc.id ? 'bg-amber-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-amber-200'}`}
                  >
                    {acc.name}
                  </button>
                ))}
                <button
                  onClick={() => setIsNewAccountModalOpen(true)}
                  className="px-2.5 py-1.5 rounded-lg text-xs font-bold text-emerald-400 hover:bg-emerald-500/10 border border-emerald-500/20 whitespace-nowrap"
                >
                  + Profile Title
                </button>
              </div>

              {/* Login / User Status */}
              <div className="flex items-center space-x-2">
                {user ? (
                  <div className="flex items-center space-x-2 bg-[#050608] border border-amber-500/30 px-3 py-1.5 rounded-xl">
                    <span className="text-xs font-mono text-amber-200 truncate max-w-[120px]">{user.email}</span>
                    <button 
                      onClick={handleLogout}
                      className="text-[10px] text-rose-400 hover:underline font-mono"
                    >
                      Logout
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => { setAuthMode('login'); setAuthError(''); setIsAuthModalOpen(true); }}
                    className="px-3.5 py-2 bg-gradient-to-r from-amber-400 to-amber-600 text-slate-950 font-black rounded-xl text-xs shadow-md uppercase"
                  >
                    Login / Sign In
                  </button>
                )}

                <button 
                  onClick={() => { setEditingNoteId(null); setTradeForm({ symbol: 'NAS100', type: 'WIN', title: '', pnl: '', content: '', lessons: '' }); setIsTradeModalOpen(true); }}
                  className="px-3.5 py-2 bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-black rounded-xl text-xs shadow-md uppercase"
                >
                  + Log Trade
                </button>
              </div>
            </header>

            <main className="flex-1 p-3 sm:p-6 max-w-6xl mx-auto w-full space-y-4 sm:space-y-6">
              
              {activeTab === 'dashboard' ? (
                <>
                  {/* Account Profile Management Bar */}
                  <div className="bg-[#0F1118] border border-amber-500/20 rounded-2xl p-4 flex flex-wrap justify-between items-center gap-3">
                    <div className="flex items-center space-x-3">
                      <div>
                        <span className="text-[10px] text-amber-400 font-mono uppercase font-bold tracking-wider">Active Profile</span>
                        <div className="flex items-center space-x-2 mt-0.5">
                          <h2 className="text-base sm:text-lg font-bold text-white font-mono">
                            {accounts.find(a => a.id === activeAccountId)?.name}
                          </h2>
                          <button 
                            onClick={() => {
                              const curr = accounts.find(a => a.id === activeAccountId);
                              const rename = prompt('Rename account profile title:', curr?.name);
                              if (rename && rename.trim()) {
                                setAccounts(accounts.map(a => a.id === activeAccountId ? { ...a, name: rename.trim() } : a));
                              }
                            }}
                            className="text-xs text-amber-400 hover:underline font-mono"
                          >
                            ✏️ Rename
                          </button>
                          {accounts.length > 1 && (
                            <button 
                              onClick={() => {
                                if (confirm('Delete this account profile?')) {
                                  const rem = accounts.filter(a => a.id !== activeAccountId);
                                  setAccounts(rem);
                                  setActiveAccountId(rem[0].id);
                                }
                              }}
                              className="text-xs text-rose-400 hover:underline font-mono"
                            >
                              🗑️ Delete
                            </button>
                          )}
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center space-x-4 text-right">
                      <div>
                        <p className="text-[10px] text-slate-400 uppercase font-bold">Net P&L</p>
                        <p className={`text-base sm:text-lg font-mono font-black ${stats.totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          ${stats.totalPnl.toLocaleString()}
                        </p>
                      </div>
                      <div>
                        <p className="text-[10px] text-slate-400 uppercase font-bold">Win Rate</p>
                        <p className="text-base sm:text-lg font-mono font-black text-amber-300">{stats.winRate}%</p>
                      </div>
                    </div>
                  </div>

                  {/* Candlestick Visualizer & Log View */}
                  <div className="bg-[#0F1118] border border-amber-500/20 rounded-2xl p-4 sm:p-6 shadow-xl space-y-4">
                    <h3 className="text-xs font-mono font-bold text-amber-200 uppercase tracking-wider">Session Candlestick Chart View</h3>
                    
                    {notes.length > 0 ? (
                      <div className="bg-[#050608] rounded-xl p-4 border border-amber-500/10 overflow-x-auto flex items-end h-48 space-x-3 pt-6">
                        {notes.slice().reverse().map((n) => {
                          const isWin = n.type === 'WIN';
                          const isSelected = selectedNote?.id === n.id;
                          const heightPx = Math.min(Math.max(Math.abs(n.pnl) / 10, 24), 90);
                          return (
                            <div 
                              key={n.id}
                              onClick={() => setSelectedNoteId(n.id)}
                              className={`flex flex-col items-center cursor-pointer flex-1 min-w-[32px] h-full justify-end group transition ${isSelected ? 'scale-105' : ''}`}
                            >
                              <div className={`w-[2px] h-3 ${isWin ? 'bg-emerald-400' : 'bg-rose-400'}`}></div>
                              <div 
                                className={`w-full rounded-[2px] transition-all ${isWin ? 'bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.3)]' : 'bg-rose-600 shadow-[0_0_10px_rgba(244,63,94,0.3)]'} ${isSelected ? 'ring-2 ring-amber-300' : ''}`}
                                style={{ height: `${heightPx}px` }}
                              ></div>
                              <div className={`w-[2px] h-3 ${isWin ? 'bg-emerald-400' : 'bg-rose-400'}`}></div>
                              <span className="text-[9px] text-slate-400 font-mono mt-2 truncate w-full text-center">{n.symbol}</span>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <div className="bg-[#050608] rounded-xl p-8 text-center border border-slate-800 text-slate-500 text-xs">
                        No trade entries yet under this profile. Click <span className="text-emerald-400 font-bold">"+ Log Trade"</span> above to add your first entry!
                      </div>
                    )}
                  </div>

                  {/* Detailed Selected Trade View */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
                    <div className="md:col-span-2 bg-[#0F1118] border border-amber-500/15 rounded-2xl p-4 sm:p-6 space-y-4 shadow-xl">
                      {selectedNote ? (
                        <>
                          <div className="flex justify-between items-start border-b border-slate-800 pb-3 gap-2">
                            <div>
                              <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold font-mono ${selectedNote.type === 'WIN' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>
                                {selectedNote.symbol} &bull; {selectedNote.type}
                              </span>
                              <h2 className="text-base sm:text-lg font-bold text-white mt-2">{selectedNote.title}</h2>
                            </div>
                            <div className="flex items-center space-x-2">
                              <span className={`text-base sm:text-xl font-mono font-black ${selectedNote.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                ${selectedNote.pnl}
                              </span>
                              <button 
                                onClick={() => {
                                  setEditingNoteId(selectedNote.id);
                                  setTradeForm({
                                    symbol: selectedNote.symbol,
                                    type: selectedNote.type,
                                    title: selectedNote.title,
                                    pnl: selectedNote.pnl,
                                    content: selectedNote.content || '',
                                    lessons: selectedNote.lessons || ''
                                  });
                                  setIsTradeModalOpen(true);
                                }}
                                className="px-2.5 py-1 bg-[#171A24] text-amber-200 text-xs rounded-lg border border-amber-500/20"
                              >
                                Edit
                              </button>
                              <button 
                                onClick={() => handleDeleteNote(selectedNote.id)}
                                className="px-2.5 py-1 bg-rose-500/10 text-rose-400 text-xs rounded-lg border border-rose-500/20"
                              >
                                Delete
                              </button>
                            </div>
                          </div>
                          <p className="text-slate-300 text-xs sm:text-sm leading-relaxed">{selectedNote.content}</p>
                          {selectedNote.lessons && (
                            <div className="p-3 bg-[#050608] rounded-xl border border-slate-800 text-xs text-amber-300/90">
                              <span className="font-bold block text-amber-400 mb-0.5">Lesson / Note:</span>
                              {selectedNote.lessons}
                            </div>
                          )}
                        </>
                      ) : (
                        <div className="text-center py-10 text-slate-500 text-xs">Select a trade entry from the log list.</div>
                      )}
                    </div>

                    <div className="bg-[#0F1118] border border-amber-500/15 rounded-2xl p-4 space-y-3 shadow-xl">
                      <h3 className="text-xs font-mono font-bold text-amber-200 uppercase">Trade Entries Log</h3>
                      <div className="space-y-2 max-h-64 overflow-y-auto">
                        {notes.map(n => (
                          <div 
                            key={n.id} 
                            onClick={() => setSelectedNoteId(n.id)}
                            className={`p-3 rounded-xl text-xs cursor-pointer flex justify-between items-center border ${selectedNoteId === n.id ? 'bg-[#151924] border-amber-400' : 'bg-[#050608] border-slate-800'}`}
                          >
                            <div className="truncate max-w-[140px]">
                              <p className="font-bold text-white truncate">{n.symbol}: {n.title}</p>
                              <p className="text-[10px] text-slate-400">{n.date}</p>
                            </div>
                            <span className={`font-mono font-bold ${n.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                              ${n.pnl}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </>
              ) : (
                /* Economic Calendar Tab */
                <div className="bg-[#0F1118] border border-amber-500/20 rounded-2xl p-4 sm:p-6 space-y-5 shadow-xl">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-amber-500/10 pb-4">
                    <div>
                      <h2 className="text-base font-bold text-amber-100 font-mono">FREE GLOBAL ECONOMIC CALENDAR</h2>
                      <p className="text-xs text-slate-400">Instant economic releases and high-impact catalysts.</p>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      <input 
                        type="date"
                        value={newsDateFilter}
                        onChange={(e) => setNewsDateFilter(e.target.value)}
                        className="bg-[#050608] border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none font-mono"
                      />

                      <select 
                        value={newsFilterCurrency}
                        onChange={(e) => setNewsFilterCurrency(e.target.value)}
                        className="bg-[#050608] border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none font-mono"
                      >
                        <option value="ALL">All Currencies</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option>
                        <option value="AUD">AUD</option>
                        <option value="CAD">CAD</option>
                      </select>

                      <button
                        onClick={fetchFreeEconomicNews}
                        className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-200 text-xs rounded-xl font-mono"
                      >
                        🔄 {isNewsLoading ? 'Syncing...' : 'Sync Feed'}
                      </button>

                      <button
                        onClick={() => setIsCustomNewsModalOpen(true)}
                        className="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl shadow"
                      >
                        + Add Custom Event
                      </button>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-amber-500/10 text-amber-200/70 font-mono">
                          <th className="py-2.5 px-3">Date & Time</th>
                          <th className="py-2.5 px-3">Currency</th>
                          <th className="py-2.5 px-3">Impact</th>
                          <th className="py-2.5 px-3">Event Title</th>
                          <th className="py-2.5 px-3">Forecast</th>
                          <th className="py-2.5 px-3">Previous</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/50 font-mono">
                        {filteredNews.length > 0 ? (
                          filteredNews.map((evt) => (
                            <tr key={evt.id} className="hover:bg-amber-500/5 transition">
                              <td className="py-2.5 px-3 text-slate-300">{evt.date} &bull; {evt.time}</td>
                              <td className="py-2.5 px-3 font-bold text-amber-300">{evt.country}</td>
                              <td className="py-2.5 px-3">
                                <span className={`px-2 py-0.5 rounded-md text-[10px] font-bold ${
                                  evt.impact === 'High' ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 
                                  evt.impact === 'Medium' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                  'bg-slate-800 text-slate-400'
                                }`}>
                                  {evt.impact}
                                </span>
                              </td>
                              <td className="py-2.5 px-3 font-semibold text-slate-100">{evt.title}</td>
                              <td className="py-2.5 px-3 text-emerald-400 font-bold">{evt.forecast}</td>
                              <td className="py-2.5 px-3 text-slate-400">{evt.previous}</td>
                            </tr>
                          ))
                        ) : (
                          <tr>
                            <td colSpan="6" className="text-center py-8 text-slate-500">
                              No events found for the selected currency or date filter.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </main>

            {/* Modal: Trader Authentication (Login / Sign Up) */}
            {isAuthModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-[#0F1118] border border-amber-500/30 p-6 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl">
                  <div className="flex justify-between items-center border-b border-amber-500/10 pb-3">
                    <h3 className="text-amber-200 font-bold text-base font-mono">
                      {authMode === 'login' ? 'Trader Login' : 'Create Trader Account'}
                    </h3>
                    <button onClick={() => setIsAuthModalOpen(false)} className="text-slate-400 hover:text-white text-sm">✕</button>
                  </div>

                  {authError && (
                    <div className="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-2.5 rounded-xl font-mono">
                      {authError}
                    </div>
                  )}

                  <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Email Address</label>
                      <input 
                        type="email" 
                        required 
                        placeholder="trader@mindmill.io" 
                        value={authEmail} 
                        onChange={e => setAuthEmail(e.target.value)} 
                        className="w-full bg-[#050608] border border-slate-800 p-2.5 rounded-xl text-white font-mono focus:outline-none focus:border-amber-500" 
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Password</label>
                      <input 
                        type="password" 
                        required 
                        placeholder="••••••••" 
                        value={authPassword} 
                        onChange={e => setAuthPassword(e.target.value)} 
                        className="w-full bg-[#050608] border border-slate-800 p-2.5 rounded-xl text-white font-mono focus:outline-none focus:border-amber-500" 
                      />
                    </div>

                    <button 
                      type="submit" 
                      className="w-full py-2.5 bg-gradient-to-r from-amber-400 to-amber-600 font-bold text-slate-950 rounded-xl shadow-lg uppercase text-xs"
                    >
                      {authMode === 'login' ? 'Sign In' : 'Register Account'}
                    </button>
                  </form>

                  <div className="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
                    {authMode === 'login' ? "Don't have an account? " : "Already have an account? "}
                    <button 
                      onClick={() => {
                        setAuthMode(authMode === 'login' ? 'signup' : 'login');
                        setAuthError('');
                      }}
                      className="text-amber-400 font-bold hover:underline ml-1"
                    >
                      {authMode === 'login' ? 'Sign Up' : 'Log In'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal: New Account Profile */}
            {isNewAccountModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-[#0F1118] border border-amber-500/30 p-5 rounded-2xl max-w-sm w-full space-y-4">
                  <h3 className="text-amber-200 font-bold text-base">Create Account Profile</h3>
                  <form onSubmit={handleCreateAccount} className="space-y-3 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Profile Title (e.g. Prop Firm, Live FX)</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. FTMO Challenge #1" 
                        value={newAccountTitle} 
                        onChange={e => setNewAccountTitle(e.target.value)} 
                        className="w-full bg-[#050608] border border-slate-800 p-2.5 rounded-xl text-white" 
                      />
                    </div>
                    <div className="flex justify-end space-x-2 pt-2">
                      <button type="button" onClick={() => setIsNewAccountModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                      <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">Create Profile</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: Log / Edit Trade */}
            {isTradeModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-[#0F1118] border border-amber-500/30 p-5 rounded-2xl max-w-md w-full space-y-4">
                  <h3 className="text-amber-200 font-bold text-base">{editingNoteId ? 'Edit Trade Entry' : 'Log Trade Entry'}</h3>
                  <form onSubmit={handleSaveTrade} className="space-y-3 text-xs">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-slate-400 block mb-1">Symbol</label>
                        <input type="text" required value={tradeForm.symbol} onChange={e => setTradeForm({...tradeForm, symbol: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white font-mono uppercase" />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Outcome</label>
                        <select value={tradeForm.type} onChange={e => setTradeForm({...tradeForm, type: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white">
                          <option value="WIN">WIN</option>
                          <option value="LOSS">LOSS</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Trade Title / Strategy</label>
                      <input type="text" required value={tradeForm.title} onChange={e => setTradeForm({...tradeForm, title: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">P&L ($)</label>
                      <input type="number" step="any" required value={tradeForm.pnl} onChange={e => setTradeForm({...tradeForm, pnl: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white font-mono" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Trade Notes / Strategy</label>
                      <textarea rows="2" value={tradeForm.content} onChange={e => setTradeForm({...tradeForm, content: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white"></textarea>
                    </div>
                    <div className="flex justify-end space-x-2 pt-2">
                      <button type="button" onClick={() => setIsTradeModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                      <button type="submit" className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl">Save Entry</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Modal: Custom Event */}
            {isCustomNewsModalOpen && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-[#0F1118] border border-amber-500/30 p-5 rounded-2xl max-w-sm w-full space-y-4">
                  <h3 className="text-amber-200 font-bold text-base">Add Custom Market Event</h3>
                  <form onSubmit={handleAddCustomNews} className="space-y-3 text-xs">
                    <div>
                      <label className="text-slate-400 block mb-1">Event Title</label>
                      <input type="text" required value={customNewsData.title} onChange={e => setCustomNewsData({...customNewsData, title: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white" />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-slate-400 block mb-1">Currency</label>
                        <input type="text" required value={customNewsData.country} onChange={e => setCustomNewsData({...customNewsData, country: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white font-mono uppercase" />
                      </div>
                      <div>
                        <label className="text-slate-400 block mb-1">Impact</label>
                        <select value={customNewsData.impact} onChange={e => setCustomNewsData({...customNewsData, impact: e.target.value})} className="w-full bg-[#050608] border border-slate-800 p-2 rounded-xl text-white">
                          <option value="High">High</option>
                          <option value="Medium">Medium</option>
                          <option value="Low">Low</option>
                        </select>
                      </div>
                    </div>
                    <div className="flex justify-end space-x-2 pt-2">
                      <button type="button" onClick={() => setIsCustomNewsModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
                      <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">Add Event</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
